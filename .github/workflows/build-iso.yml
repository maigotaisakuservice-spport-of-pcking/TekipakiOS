name: Build Tekipaki OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies (Host)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev pkg-config docker.io

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build Custom Apps (Tekipaki-AppSet)
      env:
        TEKIPAKI_PRIVATE_KEY: ${{ secrets.TEKIPAKI_PRIVATE_KEY }}
      run: |
        cargo build --release
        mkdir -p bin
        cp target/release/tekipaki-* bin/

    - name: Build Perfect OS (Kernel, AUR, ISO)
      run: |
        # Run everything inside a privileged Arch Linux container for consistency
        docker run --rm --privileged \
          -v $(pwd):/app \
          -e CI=true \
          -e TEKIPAKI_PRIVATE_KEY="${{ secrets.TEKIPAKI_PRIVATE_KEY }}" \
          -w /app \
          archlinux:latest \
          /bin/bash -c "pacman -Syu --noconfirm base-devel archiso git bc libelf pahole cpio perl tar xz && \
          bash build-iso.sh"

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TekipakiOS-v1.6-x86_64.iso
        path: out/*.iso
