name: Build Tekipaki OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev pkg-config

    - name: Set up Rust
      run: |
        rustup toolchain install stable
        rustup default stable

    - name: Build Custom Apps (Tekipaki-AppSet)
      run: |
        cargo build --release
        mkdir -p bin
        cp target/release/tekipaki-* bin/

    - name: Build Custom Kernel (linux-tekipaki)
      run: |
        # In a real workflow, this would build the ZEN kernel PKGBUILD
        echo "Building linux-tekipaki ZEN kernel..."
        touch bin/vmlinuz-linux-tekipaki
        touch bin/initramfs-linux-tekipaki.img

    - name: Run Archiso to generate ISO
      run: |
        # Use docker to run mkarchiso on Ubuntu
        docker run --rm -v $(pwd):/app -w /app archlinux:latest \
        /bin/bash -c "pacman -Syu --noconfirm archiso && \
        mkarchiso -v -w /tmp/archiso-tmp -o out tekipakios/iso-profile"

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TekipakiOS-v1.6-x86_64.iso
        path: out/*.iso
