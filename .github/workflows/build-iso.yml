name: Build Tekipaki OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Silencing deprecation warnings while ensuring Node 20/24 compatibility
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build Perfect OS (Kernel, Rust Apps, AUR, ISO)
      run: |
        # Run everything inside a privileged Arch Linux container for consistency
        docker run --rm --privileged \
          -v $(pwd):/app \
          -e CI=true \
          -e TEKIPAKI_PRIVATE_KEY="${{ secrets.TEKIPAKI_PRIVATE_KEY }}" \
          -w /app \
          archlinux:latest \
          /bin/bash -c "pacman-key --init && pacman-key --populate archlinux && \
          pacman -Syu --noconfirm base-devel archiso git bc libelf pahole cpio perl tar xz rust gtk4 pkgconf mkinitcpio kmod mkinitcpio-archiso mkinitcpio-nfsutils arch-install-scripts binutils openssl flex bison grub libisoburn mtools dosfstools python nbd pv syslinux && \
          bash build-iso.sh"

    - name: Deploy ISO to Repository and Update Link
      if: success()
      run: |
        # Configure Git
        git config --global user.name "Tekipaki Build Bot"
        git config --global user.email "build@tekipaki-os.com"

        # Move ISO to distribution folder
        mkdir -p dist/isos
        ISO_FILE=$(ls out/*.iso | head -n 1)
        ISO_NAME=$(basename "$ISO_FILE")
        cp "$ISO_FILE" "dist/isos/$ISO_NAME"

        # Rotate: keep only last 2 versions
        ls -t dist/isos/*.iso | tail -n +3 | xargs -I {} rm -- {} || true

        # Update download.html with latest ISO link (idempotent)
        sed -i "s|href=\"[^\"]*\" class=\"btn-download\"|href=\"dist/isos/$ISO_NAME\" class=\"btn-download\"|g" download.html
        sed -i "s|onclick=\"alert('準備中...')\"||g" download.html

        # Commit and push changes
        git add dist/isos/ download.html
        git commit -m "Deploy ISO: $ISO_NAME and update download link [skip ci]"
        git push origin main
