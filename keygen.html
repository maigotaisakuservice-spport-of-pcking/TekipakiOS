<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EULAキー生成 - Tekipaki OS</title>
    <style>
        :root { --primary-blue: #0078D4; --bg-color: #f3f3f3; --text-color: #202020; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; line-height: 1.6; }
        nav { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); padding: 1rem 0; box-shadow: 0 1px 10px rgba(0,0,0,0.05); display: flex; justify-content: center; gap: 2.5rem; z-index: 1000; }
        nav a { text-decoration: none; color: var(--text-color); font-weight: 500; }
        .header { background: linear-gradient(135deg, #0078D4, #00BCF2); color: white; padding: 120px 20px 60px; text-align: center; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); text-align: center; }
        select, button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
        button { background-color: var(--primary-blue); color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #005A9E; }
        #result { margin-top: 30px; font-family: monospace; font-size: 1.5rem; font-weight: bold; color: var(--primary-blue); letter-spacing: 2px; min-height: 1.5em; }
        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-blue); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">ホーム</a>
        <a href="download.html">ダウンロード</a>
        <a href="support.html">サポート</a>
        <a href="keygen.html">キー生成</a>
        <a href="license.html">EULA</a>
    </nav>
    <header class="header">
        <h1>EULAキー生成ツール</h1>
        <p>エディションを選択してキーを生成します（管理者専用）</p>
    </header>
    <div class="container">
        <div class="card">
            <label for="edition">エディションを選択:</label>
            <select id="edition">
                <option value="Home">Home</option>
                <option value="Pro">Pro</option>
                <option value="Enterprise">Enterprise</option>
            </select>
            <button onclick="generateKey()">キーを生成</button>
            <div id="loader" class="loader"></div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const KEY_CHARS = "2346789ABCDEFGHJKLMNPQRTUVWXY";
        const X = BigInt("0x4B45492D53554B49");
        const Y = BigInt("0x54454B4950414B49");
        const Z = BigInt("0xDEADBEEFCAFEBABE");
        const OFFSET = 120n * (2n ** 192n);
        const EXP = 3n ** 52n;

        function modPow(base, exp, mod) {
            let res = 1n;
            base = base % mod;
            while (exp > 0n) {
                if (exp % 2n === 1n) res = (res * base) % mod;
                base = (base * base) % mod;
                exp = exp / 2n;
            }
            return res;
        }

        function checkEdition(k) {
            const base = (k + X + OFFSET) - (Y * Z);

            if (modPow(base, EXP, 8n) === 0n) return "Enterprise";
            if (modPow(base, EXP, 5n) === 0n) return "Pro";
            if (modPow(base, EXP, 3n) === 0n) return "Home";
            return "Invalid";
        }

        function bigintToBase29(n) {
            if (n === 0n) return KEY_CHARS[0];
            let s = "";
            let temp = n;
            while (temp > 0n) {
                s = KEY_CHARS[Number(temp % 29n)] + s;
                temp = temp / 29n;
            }
            return s;
        }

        async function generateKey() {
            const edition = document.getElementById('edition').value;
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');

            resultDiv.innerText = "";
            loader.style.display = "block";

            // Allow UI to update
            await new Promise(r => setTimeout(r, 50));

            let found = false;
            let key = "";

            while (!found) {
                // Generate ~120 bit random bigint
                let k = 0n;
                for (let i = 0; i < 4; i++) {
                    k = (k << 32n) + BigInt(Math.floor(Math.random() * 0xFFFFFFFF));
                }

                if (checkEdition(k) === edition) {
                    let base29 = bigintToBase29(k);
                    while (base29.length < 25) base29 = KEY_CHARS[0] + base29;
                    if (base29.length > 25) continue; // Should not happen with 120 bit

                    key = base29.match(/.{1,5}/g).join('-');
                    found = true;
                }
            }

            loader.style.display = "none";
            resultDiv.innerText = key;
        }
    </script>
</body>
</html>
