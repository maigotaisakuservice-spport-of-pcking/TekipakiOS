<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダウンロード - Tekipaki OS</title>
    <style>
        :root { --primary-blue: #0078D4; --bg-color: #f3f3f3; --text-color: #202020; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; }
        nav { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); padding: 1rem 0; box-shadow: 0 1px 10px rgba(0,0,0,0.05); display: flex; justify-content: center; gap: 2.5rem; z-index: 1000; }
        nav a { text-decoration: none; color: var(--text-color); font-weight: 500; }
        .download-container { padding: 150px 20px; text-align: center; max-width: 800px; margin: 0 auto; }
        .download-card { background: var(--white); padding: 50px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .download-card h1 { font-size: 2.5rem; margin-bottom: 20px; }
        .btn-download { background: var(--primary-blue); color: var(--white); padding: 15px 40px; border-radius: 50px; font-weight: bold; text-decoration: none; font-size: 1.2rem; display: inline-block; margin-top: 30px; box-shadow: 0 5px 15px rgba(0,120,212,0.4); }
        .btn-download:hover { background: #005a9e; }
        .requirements { margin-top: 50px; text-align: left; }
        .requirements h2 { font-size: 1.5rem; margin-bottom: 20px; }
        .requirements ul { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .requirements li::before { content: "✓"; color: green; margin-right: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">ホーム</a>
        <a href="download.html">ダウンロード</a>
        <a href="support.html">サポート</a>
    </nav>
    <div class="download-container">
        <div class="download-card">
            <h1>Tekipaki OS v1.6 を入手</h1>
            <p>最新の Arch Linux ベース、Windows 11 UI/UX 統合済み ISO イメージをダウンロードできます。</p>
            <a href="#" class="btn-download" onclick="alert('ビルド中...')">ISOイメージをダウンロード (x64)</a>
            <div class="requirements">
                <h2>システム要件</h2>
                <ul>
                    <li>64ビット プロセッサ (Intel/AMD)</li>
                    <li>4 GB 以上のメモリ (RAM)</li>
                    <li>20 GB 以上のディスク空き容量</li>
                    <li>DirectX 12 互換のグラフィックス</li>
                    <li>UEFI セキュアブート対応</li>
                    <li>TPM 2.0 (推奨)</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
